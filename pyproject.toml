[project]
name = "camvault"
version = "0.3.0"
description = "Cross-platform ONVIF/RTSP camera recorder with RAM-buffered HLS playback and pluggable local/WebDAV archive backends"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CamVault contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "defusedxml>=0.7,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
  # Some minimal Linux/container images also omit the system IANA database.
  "tzdata>=2024.1",
]

[project.scripts]
camvault = "camvault.cli:main"

[build-system]
requires = ["uv_build>=0.10,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv.build-backend]
module-name = "camvault"
module-root = "src"
source-include = [
  "LICENSE",
  "SECURITY.md",
  "TEST_REPORT.md",
  "CHANGELOG.md",
  "config.example.toml",
  "deploy/**",
  "docs/**",
  "tests/**",
]
