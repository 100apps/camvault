[server]
# For LAN playback use 0.0.0.0 and set CAMVAULT_WEB_PASSWORD.
# Do not bind only to a concrete LAN IP: FFmpeg ingest intentionally uses loopback.
host = "0.0.0.0"
port = 8088
playback_token_env = "CAMVAULT_PLAYBACK_TOKEN"
web_password_env = "CAMVAULT_WEB_PASSWORD"
session_hours = 24
allow_unauthenticated_lan = false
access_log = false

[logging]
# Recent diagnostics stay in RAM for the web console. File writes are batched.
# Use file = "" to keep logs in RAM/console only. Place the file on the archive disk
# when avoiding writes to the system SSD matters.
file = "./logs/camvault.log"
memory_records = 2000
batch_records = 128
flush_seconds = 30
max_file_mb = 20
backup_count = 5

[storage]
# "local": large sequential files on a local HDD/SSD/NAS mount.
# "webdav": stream archive batches from RAM to AList/WebDAV; no local media spool.
backend = "webdav"

# Used only by backend="local". Prefer a surveillance HDD/NAS mount.
# A relative path is resolved beside this config file.
root = "./recordings"

timezone = "Asia/Shanghai"
# Used as the fixed interval or as the fallback if available memory cannot be measured.
archive_chunk_seconds = 600
# Dynamic WebDAV batching: estimate each camera bitrate and continuously choose n seconds.
adaptive_archive_enabled = true
adaptive_archive_min_seconds = 120
adaptive_archive_max_seconds = 1800
adaptive_archive_target_mb = 32
# Use at most this share of currently available RAM after keeping the reserve untouched.
adaptive_memory_percent = 5
adaptive_memory_reserve_mb = 512
# Absolute hard ceiling across the active upload, queue and accumulator for each camera.
max_buffer_mb_per_camera = 128
retention_days = 30
max_storage_gb = 0
# For WebDAV, set this to 0 unless the server exposes DAV:quota-available-bytes.
min_free_gb = 0
retention_check_seconds = 3600
partial_max_age_hours = 24
# On the first archive write failure, delete the oldest managed recordings and retry
# the identical archive transaction. Use "retry" to never delete because of a write error.
write_failure_policy = "delete_oldest"
write_failure_reclaim_mb = 512
write_failure_max_delete_files = 100
# Used only by backend="local".
fsync = false

[storage.webdav]
# AList normally exposes WebDAV at http[s]://host:5244/dav.
# Do not place credentials in this URL.
url = "http://127.0.0.1:5244/dav"
# This may include the AList storage mount, e.g. /MyCloud/CamVault.
# Use a dedicated non-root collection.
root = "/CamVault"
username_env = "CAMVAULT_WEBDAV_USERNAME"
password_env = "CAMVAULT_WEBDAV_PASSWORD"
# Encrypt video and metadata before they leave this machine. The key must be exactly
# 32 random bytes encoded as Base64 and supplied only through the named environment variable.
encryption_enabled = true
encryption_key_env = "CAMVAULT_ARCHIVE_KEY"
# 1 MiB authenticated chunks preserve efficient Range playback without whole-file buffering.
encryption_chunk_kb = 1024
verify_tls = true
connect_timeout_seconds = 10
request_timeout_seconds = 900
# Shared by uploads, playback proxying and WebDAV metadata operations.
max_connections = 8
# Upload to a transaction object and commit with WebDAV MOVE.
# Leave enabled for AList drivers that pass `camvault storage-check`.
atomic_upload = true
# VOD requests within this range scan only the overlapping hour directories.
targeted_scan_max_hours = 168
max_index_response_mb = 64
index_cache_entries = 128

[recording]
ffmpeg_path = "ffmpeg"
ffprobe_path = "ffprobe"
hls_segment_seconds = 2
live_window_segments = 8
max_live_memory_mb_per_camera = 64
max_ingest_segment_mb = 64
rtsp_transport = "tcp"
input_timeout_seconds = 20
startup_timeout_seconds = 60
no_segment_timeout_seconds = 45
health_check_seconds = 5
restart_min_seconds = 1
restart_max_seconds = 60
include_audio = true
# Keeps browser playback working when an unchangeable camera outputs H.265/HEVC.
# Requires an FFmpeg build with the source decoder and libx264.
video_codec = "h264"
# AAC improves browser compatibility; set copy to avoid even audio transcoding.
audio_codec = "aac"
audio_bitrate = "48k"
# Reuses the AAC decode path; one lightweight RMS value is kept per HLS segment.
audio_index_enabled = true
# Increase toward 0 to ignore quiet ambient noise; decrease to mark softer sounds.
audio_activity_threshold_db = -35
h264_preset = "ultrafast"
h264_crf = 20
fps_mode = "passthrough"
# Error-only avoids noisy camera timestamp warnings during 7x24 operation.
# Temporarily use "warning" or "info" only while troubleshooting.
ffmpeg_loglevel = "error"

[[cameras]]
id = "living_room"
name = "客厅"
enabled = true
host = "192.168.1.101"
onvif_port = 80
username = "admin"
password_env = "CAMVAULT_LIVING_ROOM_PASSWORD"
# Optional profile selection. With none set, CamVault chooses the highest-resolution profile.
# profile_name = "main"
# profile_token = "Profile_1"
# profile_index = 0

[[cameras]]
id = "door"
name = "门口"
enabled = true
host = "192.168.1.102"
onvif_port = 80
username = "admin"
password_env = "CAMVAULT_DOOR_PASSWORD"

